{% extends "base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center;">
    <h2 style="color: #333;">Edit Resource</h2>
    <p style="color: #888; font-size: 14px;">Original File: {{ file.file.name }}</p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px; text-align: left;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #555;">Update Display Title</label>
            {{ form.title }}
        </div>

        <div style="margin-bottom: 25px; text-align: left;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #555;">Replace File (Optional)</label>
            {{ form.file }}
        </div>

        <button type="submit" style="width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px;">
            Save Changes
        </button>
        
        <button type="submit" name="delete" value="true" 
                style="width: 100%; padding: 10px; background: none; color: #dc3545; border: 1px solid #dc3545; border-radius: 5px; cursor: pointer; font-weight: 600;"
                onclick="return confirm('Are you sure? This will permanently delete the file.')">
            Delete This File
        </button>
    </form>
    
    <a href="{% url 'my_uploads' %}" style="display: block; margin-top: 20px; color: #666; text-decoration: none; font-size: 14px;">Cancel</a>
</div>
{% endblock %}
